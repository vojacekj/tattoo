<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Tattoo Video</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        pre {
            font-size: 10px;
            line-height: 10px;
            letter-spacing: 0px;
            color: #fff;
            white-space: pre;
            overflow: hidden;
            margin: 0;
        }
    </style>
</head>
<body>
<pre id="asciiDisplay">Loading frames...</pre>

<script>
    const CHARS = '@%#*+=-:. ';
    const PLAYBACK_FPS = 25 / 4;

    let frames, w, h, n, current = 0, intervalId;

    const pre = document.getElementById('asciiDisplay');

    function render() {
        if (!frames) return;
        const offset = current * w * h;
        let out = '';
        for (let r = 0; r < h; r++) {
            for (let c = 0; c < w; c++) {
                out += CHARS[frames[offset + r * w + c]];
            }
            out += '\n';
        }
        pre.textContent = out;
    }

    function step() {
        current++;
        if (current >= n) current = 0;
        render();
    }

    fetch('frames.bin')
        .then(res => res.arrayBuffer())
        .then(buf => {
            const dv = new DataView(buf);
            w = dv.getUint8(0);
            h = dv.getUint8(1);
            n = dv.getInt32(4, true);
            frames = new Uint8Array(buf, 8);
            render();
            intervalId = setInterval(step, 1000 / PLAYBACK_FPS);
        })
        .catch(() => {
            pre.textContent = 'Failed to load frames.bin';
        });
</script>
</body>
</html>
