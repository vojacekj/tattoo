<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Tattoo Video</title>
    <style>
        body {
            font-family: monospace;
            background-color: #000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: #111;
            color: #0f0;
            padding: 10px 0;
            width: 100%;
            text-align: center;
            font-size: 1.2em;
        }

        section {
            margin: 20px;
            padding: 20px;
            background-color: #000;
            max-width: 1000px;
            width: 100%;
        }

        pre {
            font-size: 6px;
            line-height: 6px;
            letter-spacing: 0px;
            color: #0f0;
            white-space: pre;
            overflow: hidden;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            color: #0f0;
            font-size: 14px;
        }

        .controls button {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 6px 16px;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
        }

        .controls button:hover {
            background: #0f0;
            color: #000;
        }

        footer {
            margin-top: auto;
            background-color: #111;
            color: #0f0;
            padding: 10px 0;
            width: 100%;
            text-align: center;
            font-size: 0.9em;
        }

        #status {
            color: #0f0;
            font-size: 14px;
            font-family: monospace;
        }
    </style>
</head>
<body>
<header>ASCII Tattoo Video</header>

<section>
    <div class="controls">
        <button id="playBtn">Play</button>
        <button id="restartBtn">Restart</button>
        <span id="timeDisplay">0:00 / 0:00</span>
    </div>
    <pre id="asciiDisplay">Loading frames...</pre>
</section>

<footer>
    <p>&copy; 2024 tattoo.github.io &mdash; <a href="index.html" style="color:#0f0;">Regular version</a></p>
</footer>

<script>
    const CHARS = '@%#*+=-:. ';
    const PLAYBACK_FPS = 25 / 4;

    let frames = [];
    let w, h, fpsNum, fpsDen, n;
    let current = 0;
    let playing = false;
    let intervalId = null;

    const pre = document.getElementById('asciiDisplay');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const timeDisplay = document.getElementById('timeDisplay');

    function buildRowBuf(charsPerRow) {
        const rows = new Array(h);
        const rowLen = w;
        for (let r = 0; r < h; r++) {
            rows[r] = frames[current].subarray(r * rowLen, (r + 1) * rowLen);
        }
        return rows;
    }

    function render() {
        if (!frames.length) return;
        const offset = current * w * h;
        let out = '';
        for (let r = 0; r < h; r++) {
            for (let c = 0; c < w; c++) {
                out += CHARS[frames[offset + r * w + c]];
            }
            out += '\n';
        }
        pre.textContent = out;

        const totalSec = (n / PLAYBACK_FPS);
        const curSec = (current / PLAYBACK_FPS);
        timeDisplay.textContent = `${fmt(curSec)} / ${fmt(totalSec)}`;
    }

    function fmt(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function step() {
        current++;
        if (current >= n) {
            current = 0;
            if (!playing) return;
        }
        render();
    }

    function togglePlay() {
        if (!frames.length) return;
        if (playing) {
            playing = false;
            clearInterval(intervalId);
            intervalId = null;
            playBtn.textContent = 'Play';
        } else {
            playing = true;
            if (current >= n - 1) current = 0;
            playBtn.textContent = 'Pause';
            intervalId = setInterval(step, 1000 / PLAYBACK_FPS);
        }
    }

    function restart() {
        if (!frames.length) return;
        current = 0;
        if (playing) {
            clearInterval(intervalId);
            playing = true;
            intervalId = setInterval(step, 1000 / PLAYBACK_FPS);
        }
        render();
    }

    playBtn.addEventListener('click', togglePlay);
    restartBtn.addEventListener('click', restart);

    fetch('frames.bin')
        .then(res => res.arrayBuffer())
        .then(buf => {
            const dv = new DataView(buf);
            w = dv.getUint8(0);
            h = dv.getUint8(1);
            fpsNum = dv.getUint8(2);
            fpsDen = dv.getUint8(3);
            n = dv.getInt32(4, true);
            frames = new Uint8Array(buf, 8);
            pre.style.display = 'block';
            render();
        })
        .catch(() => {
            pre.textContent = 'Failed to load frames.bin';
        });
</script>
</body>
</html>
