<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Tattoo Video</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>

<script>
    const CHARS = ' .:-=+*#%@';
    const PLAYBACK_FPS = 25 / 6;
    const CHAR_RATIO = 0.55;

    let frames, w, h, palette, n, current = 0, intervalId, drawFs, dpr, vw, vh;
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
        dpr = window.devicePixelRatio || 1;
        vw = window.innerWidth;
        vh = window.innerHeight;

        canvas.width = Math.round(vw * dpr);
        canvas.height = Math.round(vh * dpr);
        canvas.style.width = vw + 'px';
        canvas.style.height = vh + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (w) {
            drawFs = vw / (w * CHAR_RATIO);
            if (frames) render();
        }
    }

    window.addEventListener('resize', resize);
    resize();

    function render() {
        if (!frames) return;
        const offset = current * w * h;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, vw, vh);

        const charW = drawFs * CHAR_RATIO;
        ctx.font = `${drawFs}px monospace`;
        ctx.textBaseline = 'top';

        for (let r = 0; r < h; r++) {
            for (let c = 0; c < w; c++) {
                const packed = frames[offset + r * w + c];
                const ci = packed & 0x0f;
                const pi = packed >> 4;
                const p = palette[pi];
                ctx.fillStyle = `rgb(${p[0]},${p[1]},${p[2]})`;
                ctx.fillText(CHARS[ci], c * charW, r * drawFs);
            }
        }
    }

    function step() {
        current++;
        if (current >= n) current = 0;
        render();
    }

    fetch('frames.bin')
        .then(res => res.arrayBuffer())
        .then(buf => {
            const dv = new DataView(buf);
            w = dv.getUint8(0);
            h = dv.getUint8(1);
            n = dv.getInt32(4, true);
            palette = [];
            for (let i = 0; i < 16; i++) {
                palette.push([dv.getUint8(8 + i*3), dv.getUint8(9 + i*3), dv.getUint8(10 + i*3)]);
            }
            frames = new Uint8Array(buf, 8 + 16*3);

            resize();
            intervalId = setInterval(step, 1000 / PLAYBACK_FPS);
        })
        .catch(() => {
            document.body.innerHTML = '<pre style="color:#fff">Failed to load frames.bin</pre>';
        });
</script>
</body>
</html>
